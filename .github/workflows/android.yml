name: Build Android

# Runs when code is pushed to main, or when you press "Run workflow" by hand.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Gradle wrapper files are generated here, so the build works even
      # if gradlew / gradle-wrapper.jar were not committed with the project.
      # This downloads Gradle 8.11.1 (about 130 MB) on the runner, which has
      # fast internet, so it only takes a minute or two.
      - name: Install Gradle 8.11.1 and generate wrapper
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          export PATH="$PWD/gradle-8.11.1/bin:$PATH"
          gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build debug AAB
        run: ./gradlew bundleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fruit-slice-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: fruit-slice-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
